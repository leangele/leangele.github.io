<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="50" cy="92" rx="30" ry="6" fill="#141a12" opacity="0.3" shape-rendering="auto"/>

  <!-- Pixel Quiver on Back -->
  <rect x="62" y="32" width="6" height="24" fill="#6d3916"/>
  <rect x="62" y="28" width="6" height="4" fill="#a15522"/>
  <rect x="64" y="22" width="2" height="6" fill="#f5f5f4"/>
  <rect x="62" y="22" width="2" height="3" fill="#ea580c"/>
  <rect x="66" y="24" width="2" height="3" fill="#ea580c"/>

  <!-- Cloak / Body Base -->
  <rect x="36" y="44" width="28" height="40" fill="#166534"/>
  <rect x="32" y="52" width="36" height="32" fill="#14532d"/>
  <rect x="30" y="74" width="40" height="12" fill="#0f3d21"/>

  <!-- Tunic Highlights & Shading -->
  <rect x="40" y="46" width="20" height="26" fill="#15803d"/>
  <rect x="44" y="48" width="12" height="20" fill="#22c55e"/>
  
  <!-- Leather Belt & Buckle -->
  <rect x="32" y="66" width="36" height="6" fill="#542e13"/>
  <rect x="34" y="68" width="32" height="2" fill="#783e18"/>
  <rect x="46" y="66" width="8" height="6" fill="#ca8a04"/>
  <rect x="48" y="68" width="4" height="2" fill="#fef08a"/>

  <!-- Boots / Feet -->
  <rect x="38" y="84" width="8" height="6" fill="#381e0d"/>
  <rect x="54" y="84" width="8" height="6" fill="#381e0d"/>

  <!-- Hood & Head -->
  <rect x="36" y="16" width="28" height="28" fill="#14532d"/>
  <rect x="38" y="18" width="24" height="24" fill="#15803d"/>
  <rect x="42" y="16" width="16" height="4" fill="#22c55e"/>

  <!-- Feather in Cap -->
  <rect x="58" y="10" width="8" height="4" fill="#f97316"/>
  <rect x="64" y="8" width="8" height="4" fill="#fb923c"/>
  <rect x="70" y="6" width="4" height="4" fill="#fed7aa"/>

  <!-- Face opening in hood -->
  <rect x="42" y="24" width="16" height="14" fill="#ffedd5"/>
  <rect x="44" y="26" width="12" height="10" fill="#fed7aa"/>
  
  <!-- Pixel Eyes -->
  <rect x="44" y="28" width="3" height="4" fill="#0f172a"/>
  <rect x="53" y="28" width="3" height="4" fill="#0f172a"/>
  <rect x="45" y="28" width="1" height="1" fill="#ffffff"/>
  <rect x="54" y="28" width="1" height="1" fill="#ffffff"/>

  <!-- Wooden Bow in Left Hand -->
  <g id="pixel-bow">
    <rect x="18" y="24" width="4" height="6" fill="#a15522"/>
    <rect x="14" y="30" width="4" height="8" fill="#a15522"/>
    <rect x="12" y="38" width="4" height="22" fill="#783e18"/>
    <rect x="14" y="60" width="4" height="8" fill="#a15522"/>
    <rect x="18" y="68" width="4" height="6" fill="#a15522"/>
    <!-- Bow Grip -->
    <rect x="12" y="46" width="4" height="6" fill="#ca8a04"/>
    <!-- Bow String -->
    <rect x="22" y="26" width="2" height="46" fill="#e2e8f0" opacity="0.85"/>
    <!-- Nocked Arrow -->
    <rect x="16" y="48" width="22" height="2" fill="#0284c7"/>
    <polygon points="38,46 44,49 38,52" fill="#38bdf8" shape-rendering="auto"/>
    <rect x="14" y="47" width="4" height="4" fill="#f97316"/>
  </g>
</svg>
