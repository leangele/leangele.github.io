<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Shadows & filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Shadow -->
  <ellipse cx="50" cy="110" rx="34" ry="7" fill="#000" opacity="0.25"/>

  <!-- Quiver on back (situado en la espalda a la izquierda) -->
  <rect x="31" y="32" width="15" height="42" rx="4" fill="#7A3E1D"/>
  <!-- Arrows in quiver -->
  <path d="M 43 32 L 45 18 M 39 32 L 38 16 M 34 32 L 32 20" stroke="#2C3E50" stroke-width="2"/>
  <polygon points="47,18 43,18 45,14" fill="#E65100"/>
  <polygon points="40,16 36,16 38,12" fill="#E65100"/>
  <polygon points="34,20 30,20 32,16" fill="#E65100"/>

  <!-- Body/Tunic -->
  <path d="M 33 43 L 67 43 L 71 85 L 29 85 Z" fill="#2E6930" stroke="#1D471F" stroke-width="2"/>
  <!-- Belt -->
  <rect x="31" y="59" width="38" height="6" fill="#7A3E1D"/>
  <rect x="46" y="58" width="8" height="8" fill="#D4AC0D"/>

  <!-- Legs -->
  <rect x="36" y="85" width="10" height="18" fill="#1D471F"/>
  <rect x="54" y="85" width="10" height="18" fill="#1D471F"/>
  <!-- Boots -->
  <rect x="34" y="98" width="13" height="8" rx="2" fill="#5D4037"/>
  <rect x="53" y="98" width="13" height="8" rx="2" fill="#5D4037"/>

  <!-- Head -->
  <ellipse cx="50" cy="30" rx="17" ry="14" fill="#2E6930" stroke="#1D471F" stroke-width="2"/>
  <ellipse cx="50" cy="31" rx="10" ry="7" fill="#FFE0BD"/>
  <!-- Ojos mirando al frente/derecha hacia el enemigo -->
  <circle cx="48" cy="30" r="1.5" fill="#1C2833"/>
  <circle cx="54" cy="30" r="1.5" fill="#1C2833"/>
  <!-- Pluma orientada hacia atrás -->
  <path d="M 42 20 C 35 15, 25 18, 28 22 C 32 22, 40 21, 42 20 Z" fill="#E65100"/>

  <!-- Arco en la mano delantera apuntando hacia la derecha (hacia el enemigo) -->
  <g class="svg-hero-tool">
    <path d="M 78 25 Q 88 75 78 105" stroke="#7A3E1D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="78" y1="26" x2="78" y2="104" stroke="#E0E6ED" stroke-width="1.5"/>
  </g>
  <!-- Flecha nockada orientada hacia adelante / enemigo -->
  <g class="svg-nocked-arrow">
    <line x1="62" y1="65" x2="84" y2="65" stroke="#2C3E50" stroke-width="2.5"/>
    <polygon points="84,62 90,65 84,68" fill="#0080FF"/>
    <polygon points="62,62 59,65 62,68" fill="#FF6600"/>
  </g>
</svg>
