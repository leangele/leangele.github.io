<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hill-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="hill-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="hill-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="leaf-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leaf-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="trunk-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="forest-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Colinas ondulantes de fondo -->
  <path d="M 0 220 Q 300 150 600 200 Q 900 140 1200 190 L 1200 400 L 0 400 Z" fill="url(#hill-back)" />

  <!-- Bosque de Fondo: Siluetas de Pinos Nórdicos -->
  <g fill="#166534" opacity="0.85">
    <!-- Pinos Izquierda -->
    <polygon points="40,160 20,230 60,230" />
    <polygon points="40,140 25,190 55,190" />
    <polygon points="40,120 28,160 52,160" />

    <polygon points="90,170 65,240 115,240" />
    <polygon points="90,145 72,200 108,200" />
    <polygon points="90,125 78,170 102,170" />

    <polygon points="150,180 128,250 172,250" />
    <polygon points="150,155 134,210 166,210" />

    <!-- Pinos Centro-Derecha -->
    <polygon points="760,165 738,235 782,235" />
    <polygon points="760,145 744,195 776,195" />

    <polygon points="820,150 795,225 845,225" />
    <polygon points="820,130 802,185 838,185" />
    <polygon points="820,110 808,155 832,155" />

    <polygon points="1120,170 1095,240 1145,240" />
    <polygon points="1120,145 1102,200 1138,200" />
    <polygon points="1120,125 1108,170 1132,170" />
  </g>

  <!-- Colina Intermedia -->
  <path d="M 0 260 Q 250 190 550 250 Q 850 200 1200 240 L 1200 400 L 0 400 Z" fill="url(#hill-mid)" />

  <!-- Gran Robledal Frondoso (Árboles vibrantes y llenos de vida) -->
  <g filter="url(#forest-shadow)">
    <!-- Gran Árbol Izquierdo -->
    <path d="M 220 370 Q 225 280 230 220 Q 235 280 240 370 Z" fill="url(#trunk-wood)" />
    <!-- Copa del árbol en racimos frondosos -->
    <circle cx="230" cy="180" r="58" fill="url(#leaf-emerald)" />
    <circle cx="185" cy="195" r="48" fill="url(#leaf-bright)" />
    <circle cx="275" cy="195" r="48" fill="url(#leaf-emerald)" />
    <circle cx="210" cy="140" r="44" fill="url(#leaf-bright)" />
    <circle cx="255" cy="140" r="42" fill="url(#leaf-bright)" />
    <ellipse cx="230" cy="125" rx="30" ry="22" fill="#86efac" opacity="0.6" />

    <!-- Roble Secundario -->
    <path d="M 370 380 Q 375 300 378 250 Q 382 300 388 380 Z" fill="url(#trunk-wood)" />
    <circle cx="380" cy="220" r="48" fill="url(#leaf-bright)" />
    <circle cx="345" cy="235" r="38" fill="url(#leaf-emerald)" />
    <circle cx="415" cy="235" r="38" fill="url(#leaf-emerald)" />
    <circle cx="380" cy="185" r="34" fill="#a7f3d0" opacity="0.8" />

    <!-- Gran Árbol Derecho -->
    <path d="M 980 370 Q 985 270 990 210 Q 995 270 1000 370 Z" fill="url(#trunk-wood)" />
    <circle cx="990" cy="170" r="62" fill="url(#leaf-emerald)" />
    <circle cx="940" cy="185" r="50" fill="url(#leaf-bright)" />
    <circle cx="1040" cy="185" r="50" fill="url(#leaf-emerald)" />
    <circle cx="965" cy="125" r="46" fill="url(#leaf-bright)" />
    <circle cx="1015" cy="125" r="44" fill="url(#leaf-bright)" />
    <ellipse cx="990" cy="110" rx="32" ry="24" fill="#bbf7d0" opacity="0.75" />

    <!-- Roble Centro-Derecha -->
    <path d="M 870 380 Q 874 310 878 260 Q 882 310 886 380 Z" fill="url(#trunk-wood)" />
    <circle cx="880" cy="230" r="46" fill="url(#leaf-bright)" />
    <circle cx="845" cy="245" r="36" fill="url(#leaf-emerald)" />
    <circle cx="915" cy="245" r="36" fill="url(#leaf-emerald)" />
    <circle cx="880" cy="195" r="32" fill="#86efac" opacity="0.8" />
  </g>

  <!-- Colina Delantera con Prado y Flores -->
  <path d="M 0 310 Q 320 250 650 300 Q 960 250 1200 280 L 1200 400 L 0 400 Z" fill="url(#hill-front)" />

  <!-- Flores silvestres y arbustos del prado -->
  <g opacity="0.9">
    <!-- Arbustos bajos -->
    <circle cx="80" cy="330" r="22" fill="#22c55e" />
    <circle cx="105" cy="325" r="26" fill="#4ade80" />
    <circle cx="130" cy="335" r="20" fill="#16a34a" />

    <circle cx="620" cy="325" r="20" fill="#22c55e" />
    <circle cx="645" cy="320" r="24" fill="#4ade80" />
    <circle cx="670" cy="328" r="18" fill="#16a34a" />

    <circle cx="1120" cy="310" r="24" fill="#22c55e" />
    <circle cx="1150" cy="305" r="28" fill="#4ade80" />

    <!-- Flores amarillas y blancas salpicadas -->
    <circle cx="150" cy="360" r="3.5" fill="#fef08a" />
    <circle cx="156" cy="358" r="3.5" fill="#fef08a" />
    <circle cx="280" cy="350" r="3.5" fill="#ffffff" />
    <circle cx="340" cy="365" r="3.5" fill="#fef08a" />
    <circle cx="450" cy="340" r="4" fill="#f472b6" />
    <circle cx="520" cy="355" r="3.5" fill="#fef08a" />
    <circle cx="720" cy="345" r="4" fill="#ffffff" />
    <circle cx="820" cy="360" r="3.5" fill="#fef08a" />
    <circle cx="930" cy="340" r="4" fill="#f472b6" />
    <circle cx="1050" cy="355" r="3.5" fill="#ffffff" />
  </g>
</svg>
