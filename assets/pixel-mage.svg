<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="50" cy="92" rx="30" ry="6" fill="#141a12" opacity="0.3" shape-rendering="auto"/>

  <!-- Wizard Robe Base -->
  <rect x="32" y="44" width="36" height="44" fill="#3b0764"/>
  <rect x="28" y="54" width="44" height="34" fill="#4c1d95"/>
  <rect x="26" y="70" width="48" height="18" fill="#581c87"/>

  <!-- Robe Highlights & Folds -->
  <rect x="34" y="46" width="32" height="38" fill="#6b21a8"/>
  <rect x="38" y="48" width="24" height="34" fill="#7e22ce"/>

  <!-- Golden Center Tabard / Stole -->
  <rect x="46" y="44" width="8" height="44" fill="#854d0e"/>
  <rect x="47" y="44" width="6" height="42" fill="#eab308"/>
  <rect x="49" y="46" width="2" height="38" fill="#fef08a"/>

  <!-- Wizard's Pointy Hat -->
  <!-- Hat Tip (Bent) -->
  <rect x="62" y="4" width="6" height="4" fill="#3b0764"/>
  <rect x="58" y="6" width="8" height="4" fill="#4c1d95"/>
  <rect x="54" y="8" width="8" height="6" fill="#581c87"/>
  <rect x="50" y="12" width="10" height="6" fill="#6b21a8"/>
  <rect x="44" y="16" width="16" height="8" fill="#6b21a8"/>
  <rect x="40" y="22" width="22" height="6" fill="#7e22ce"/>
  <!-- Gold Buckle and Hat Band -->
  <rect x="36" y="28" width="28" height="4" fill="#854d0e"/>
  <rect x="38" y="28" width="24" height="3" fill="#eab308"/>
  <rect x="48" y="27" width="6" height="6" fill="#fef08a"/>
  <!-- Hat Brim -->
  <rect x="26" y="32" width="48" height="4" fill="#3b0764"/>
  <rect x="28" y="32" width="44" height="3" fill="#581c87"/>

  <!-- Face -->
  <rect x="40" y="34" width="20" height="10" fill="#fed7aa"/>
  
  <!-- Long White Beard -->
  <rect x="38" y="40" width="24" height="14" fill="#e2e8f0"/>
  <rect x="40" y="52" width="20" height="6" fill="#cbd5e1"/>
  <rect x="44" y="56" width="12" height="6" fill="#f8fafc"/>
  <rect x="47" y="62" width="6" height="4" fill="#ffffff"/>

  <!-- Mystical Wizard Eyes (Glowing / shaded under brim) -->
  <rect x="43" y="36" width="3" height="3" fill="#06b6d4"/>
  <rect x="54" y="36" width="3" height="3" fill="#06b6d4"/>
  <rect x="44" y="37" width="1" height="1" fill="#ffffff"/>
  <rect x="55" y="37" width="1" height="1" fill="#ffffff"/>

  <!-- Wooden Staff (Right hand) -->
  <g id="pixel-staff">
    <rect x="74" y="24" width="4" height="64" fill="#451a03"/>
    <rect x="75" y="24" width="2" height="64" fill="#78350f"/>
    <!-- Staff Head Prong -->
    <rect x="72" y="16" width="4" height="10" fill="#78350f"/>
    <rect x="78" y="18" width="4" height="8" fill="#78350f"/>
    <!-- Glowing Cyan Orb -->
    <rect x="70" y="8" width="12" height="12" fill="#0891b2"/>
    <rect x="72" y="10" width="8" height="8" fill="#06b6d4"/>
    <rect x="74" y="12" width="4" height="4" fill="#67e8f9"/>
    <rect x="75" y="13" width="2" height="2" fill="#ffffff"/>
    <!-- Magical Sparkles -->
    <rect x="66" y="6" width="2" height="2" fill="#a5f3fc"/>
    <rect x="84" y="12" width="2" height="2" fill="#fef08a"/>
    <rect x="68" y="22" width="2" height="2" fill="#67e8f9"/>
  </g>
