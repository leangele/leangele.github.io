<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="50" cy="92" rx="32" ry="6" fill="#141a12" opacity="0.3" shape-rendering="auto"/>

  <!-- Red Cape Behind -->
  <rect x="28" y="44" width="44" height="42" fill="#991b1b"/>
  <rect x="26" y="52" width="48" height="34" fill="#b91c1c"/>
  <rect x="24" y="64" width="52" height="24" fill="#dc2626"/>

  <!-- Plume on Helm -->
  <rect x="48" y="4" width="6" height="12" fill="#ef4444"/>
  <rect x="52" y="2" width="4" height="8" fill="#f87171"/>
  <rect x="50" y="8" width="8" height="6" fill="#b91c1c"/>

  <!-- Plate Legs & Greaves -->
  <rect x="38" y="74" width="8" height="14" fill="#334155"/>
  <rect x="40" y="76" width="4" height="10" fill="#64748b"/>
  <rect x="54" y="74" width="8" height="14" fill="#334155"/>
  <rect x="56" y="76" width="4" height="10" fill="#64748b"/>
  <!-- Sabatons (Boots) -->
  <rect x="36" y="86" width="10" height="4" fill="#1e293b"/>
  <rect x="54" y="86" width="10" height="4" fill="#1e293b"/>

  <!-- Armor Body / Cuirass -->
  <rect x="34" y="42" width="32" height="32" fill="#334155"/>
  <rect x="36" y="44" width="28" height="28" fill="#475569"/>
  <rect x="40" y="46" width="20" height="22" fill="#64748b"/>
  <rect x="44" y="48" width="12" height="16" fill="#94a3b8"/>

  <!-- Gold Trimmed Belt -->
  <rect x="34" y="66" width="32" height="6" fill="#854d0e"/>
  <rect x="36" y="67" width="28" height="4" fill="#eab308"/>
  <rect x="46" y="65" width="8" height="8" fill="#fef08a"/>

  <!-- Pauldrons (Shoulders) -->
  <rect x="26" y="40" width="10" height="10" fill="#334155"/>
  <rect x="28" y="42" width="6" height="6" fill="#64748b"/>
  <rect x="64" y="40" width="10" height="10" fill="#334155"/>
  <rect x="66" y="42" width="6" height="6" fill="#64748b"/>

  <!-- Greathelm (Helmet) -->
  <rect x="32" y="16" width="36" height="26" fill="#1e293b"/>
  <rect x="34" y="18" width="32" height="22" fill="#475569"/>
  <rect x="38" y="20" width="24" height="16" fill="#64748b"/>
  <rect x="44" y="20" width="10" height="12" fill="#94a3b8"/>
  <!-- Gold Brow Ridge -->
  <rect x="38" y="26" width="24" height="3" fill="#ca8a04"/>
  <rect x="42" y="27" width="16" height="2" fill="#facc15"/>
  <!-- Visor Slit -->
  <rect x="36" y="30" width="28" height="4" fill="#0f172a"/>
  <!-- Visor Breath Holes -->
  <rect x="40" y="36" width="2" height="2" fill="#0f172a"/>
  <rect x="45" y="36" width="2" height="2" fill="#0f172a"/>
  <rect x="53" y="36" width="2" height="2" fill="#0f172a"/>
  <rect x="58" y="36" width="2" height="2" fill="#0f172a"/>

  <!-- Heraldic Blue Shield (Left arm / right from viewer perspective) -->
  <g id="pixel-shield">
    <rect x="6" y="42" width="24" height="28" fill="#0369a1"/>
    <rect x="8" y="44" width="20" height="24" fill="#0284c7"/>
    <rect x="10" y="70" width="16" height="8" fill="#0369a1"/>
    <rect x="14" y="78" width="8" height="6" fill="#0369a1"/>
    <rect x="16" y="84" width="4" height="2" fill="#0369a1"/>
    <!-- Gold Star on Shield -->
    <rect x="16" y="50" width="4" height="12" fill="#facc15"/>
    <rect x="12" y="54" width="12" height="4" fill="#facc15"/>
    <rect x="14" y="52" width="8" height="8" fill="#fef08a"/>
  </g>

  <!-- Steel Broadsword (Right arm) -->
  <g id="pixel-sword">
    <rect x="74" y="16" width="4" height="34" fill="#e2e8f0"/>
    <rect x="76" y="14" width="2" height="36" fill="#ffffff"/>
    <polygon points="76,10 73,16 79,16" fill="#ffffff" shape-rendering="auto"/>
    <!-- Crossguard -->
    <rect x="68" y="50" width="16" height="4" fill="#ca8a04"/>
    <rect x="70" y="51" width="12" height="2" fill="#fef08a"/>
    <!-- Grip & Pommel -->
    <rect x="74" y="54" width="4" height="8" fill="#78350f"/>
    <rect x="73" y="62" width="6" height="4" fill="#ca8a04"/>
  </g>
</svg>
