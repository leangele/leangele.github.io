<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="pixel-drop">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Sombra en el suelo -->
  <rect x="20" y="104" width="60" height="8" rx="4" fill="#000000" opacity="0.3" />

  <!-- Carcaj / Quiver a la espalda (lado izquierdo) -->
  <rect x="32" y="28" width="4" height="24" fill="#8D5524"/>
  <rect x="32" y="24" width="2" height="4" fill="#E65100"/>

  <!-- Pluma del sombrero (orientada hacia atrás a la izquierda) -->
  <rect x="36" y="12" width="6" height="3" fill="#FB923C"/>
  <rect x="30" y="9" width="6" height="3" fill="#F97316"/>
  <rect x="26" y="6" width="4" height="3" fill="#FFEDD5"/>

  <!-- Cabeza y capucha -->
  <rect x="36" y="16" width="28" height="26" fill="#15803D" />
  <rect x="40" y="20" width="20" height="6" fill="#166534" />
  <rect x="42" y="24" width="16" height="14" fill="#FED7AA" />
  <!-- Ojos mirando a la derecha / enemigo -->
  <rect x="45" y="28" width="3" height="4" fill="#0F172A" />
  <rect x="54" y="28" width="3" height="4" fill="#0F172A" />

  <!-- Torso / Túnica -->
  <rect x="32" y="42" width="36" height="24" fill="#166534" />
  <rect x="40" y="44" width="20" height="20" fill="#22C55E" />

  <!-- Cinturón -->
  <rect x="30" y="66" width="40" height="6" fill="#582C0E" />
  <rect x="46" y="65" width="8" height="8" fill="#FACC15" />
  <rect x="48" y="67" width="4" height="4" fill="#854D0E" />

  <!-- Falda de la túnica -->
  <rect x="30" y="72" width="40" height="14" fill="#14532D" />

  <!-- Piernas y Botas -->
  <rect x="38" y="84" width="8" height="6" fill="#3E1F07" />
  <rect x="54" y="84" width="8" height="6" fill="#3E1F07" />
  <rect x="36" y="90" width="10" height="6" fill="#271305" />
  <rect x="54" y="90" width="10" height="6" fill="#271305" />

  <!-- Arco en la mano delantera (derecha), apuntando al enemigo -->
  <g class="svg-hero-tool" shape-rendering="crispEdges">
    <path d="M 82 24 L 78 30 L 86 36 L 88 48 L 88 56 L 86 68 L 78 74 L 82 80" stroke="#8D5524" stroke-width="2.5" fill="none" stroke-linecap="square"/>
    <line x1="80" y1="26" x2="80" y2="78" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <!-- Flecha nockada apuntando al frente / derecha -->
  <g class="svg-nocked-arrow" shape-rendering="crispEdges">
    <line x1="62" y1="49" x2="86" y2="49" stroke="#0080FF" stroke-width="2"/>
    <polygon points="86,47 92,49 86,51" fill="#38BDF8"/>
  </g>
</svg>
